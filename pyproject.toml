[project]
name = "local-ml-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "openai==3.3.1",
    "anthropic>=0.40",
    "tqdm",
    "omegaconf==2.3.0",
    "python-dotenv>=1.1.0",
    "lightning==2.5.0",
    "torch",
    "triton-rocm; sys_platform == 'linux'",
    "requests>=2.32.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "yfinance==1.7.0",
    "pytorch-forecasting>=1.0.0",
    "mlflow==2.16.1",
    "scikit-learn>=1.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
    "beautifulsoup4>=4.12",
    "pydantic>=2.13.4",
]

# Explicitly specify which packages to include (exclude mlruns, use_cases dirs)
[tool.setuptools.packages.find]
include = ["data_pipeline*", "ML_layer*"]
exclude = ["mlruns*"]

[dependency-groups]
dev = [
    "black==25.1.0",
    "debugpy==1.8.14",
    "pytest>=8.0",
    "statsmodels>=0.14.5,<0.15.0",
]
# Extra packages for ML_layer training/evaluation and the data_pipeline reports;
# the API does not need them. tests/test_feature_screen.py also imports skglm, so
# run the full test suite with `uv sync --group training`.
training = [
    "matplotlib",
    "seaborn==0.13.2",
    "skglm>=0.5",
    "tabulate>=0.9",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
# ROCm support relies on both Triton packages, which should also be installed from
# the PyTorch index (and included in `project.dependencies`).
pytorch-triton-rocm = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = [
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
